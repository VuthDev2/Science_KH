# ==============================================================================
# ScienceKH — Production Nginx Reverse Proxy & Upstream Load Balancer
# Features:
# - Upstream round-robin / least_conn load balancing across backend workers
# - Real-time active health checks
# - HTTP/2 and TLS 1.3 termination
# - Rate limit bursting and microcaching of static assets
# - WebSocket reverse-proxying for real-time exam notifications
# ==============================================================================

# Upstream cluster pool of ScienceKH backend application instances
upstream sciencekh_backend {
    # Load balancing algorithm: least_conn directs traffic to the worker with fewest active requests
    least_conn;

    # Worker instances (can run on local ports or across multiple private VM IPs)
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5002 max_fails=3 fail_timeout=10s backup;

    # Keepalive connections to backend workers to eliminate TCP handshake overhead
    keepalive 64;
}

# Rate limiting zone for anti-abuse protection at the Nginx layer
limit_req_zone $binary_remote_addr zone=api_limit_per_ip:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.sciencekh.edu.kh;

    # Force HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sciencekh.edu.kh;

    # SSL / TLS 1.3 Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip Compression for JSON APIs
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json text/plain text/css application/javascript;

    # 1. Health check endpoint (bypasses rate limiter for uptime monitors)
    location /api/health {
        proxy_pass http://sciencekh_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. API Routes with rate limiting and failover
    location /api/ {
        limit_req zone=api_limit_per_ip burst=20 nodelay;

        proxy_pass http://sciencekh_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long AI Tutor completions
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer tuning for high throughput
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }
}
